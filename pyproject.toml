[tool.poetry]
name = "kolesa_kz"
version = "0.1.0"
description = ""
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
scrapy = "^2.13.3"
scrapyd-client = "^2.0.3"
scrapy-rotating-proxies = "^0.6.2"
pymongo = "^4.15.1"
boto3 = "^1.40.41"
dateparser = "^1.2.2"
pika = "^1.3.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
isort = "^6.0.1"
seed-isort-config = "^2.2.0"
black = "^25.1.0"
flake8 = "^7.1.2"
autoflake = "^2.3.1"
bandit = "^1.8.3"
parameterized = "^0.9.0"
mock = "^5.2.0"
requests-mock = "^1.12.1"
django-dynamic-fixture = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'FIRSTPARTY', 'LOCALFOLDER']
known_third_party = ["boto3", "botocore", "dateparser", "pika", "pymongo", "scrapy", "twisted"]

[tool.black]
line-length = 120
exclude = '''
/(
  \.git
  | tmp/
  | data/
)/
'''
